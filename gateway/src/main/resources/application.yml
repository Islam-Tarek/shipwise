spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**,/api/categories/**
            - id: auth-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/users/**
            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/inventory/**
            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**
            - id: shipping-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/shipments/**
            - id: order-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/orders/**
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/notifications/**

server:
  port: 9000

shipwise:
  jwt:
    secret: shipwise-jwt-secret-must-be-at-least-32-characters-long
  auth:
    whitelist: /api/users/**,/api/products/**,/api/categories/**,/api/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: shipwise
      deployment.environment: dev
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
          timeout: 5s
          compression: none
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
          transport: http
          timeout: 5s
          schedule-delay: 1s
          compression: none
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
