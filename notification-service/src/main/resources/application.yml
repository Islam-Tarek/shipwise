spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5433/shipwise_notification
    username: shipwise
    password: shipwise
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: shipwise
    password: shipwise
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
        recovery-interval: 1500ms
        default-requeue-rejected: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8085

custom:
  mail:
    from: ${MAIL_FROM:no-reply@localhost}