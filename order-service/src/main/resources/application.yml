spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/shipwise_orders
    username: shipwise
    password: shipwise
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: shipwise
    password: shipwise
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3000ms
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

server:
  port: 8080

temporal:
  address: localhost:7233

services:
  inventory: http://localhost:8082
  payment: http://localhost:8083
  shipping: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: shipwise
      deployment.environment: dev
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
          timeout: 5s
          compression: none
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
          transport: http
          timeout: 5s
          schedule-delay: 1s
          compression: none
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
