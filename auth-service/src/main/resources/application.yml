spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/shipwise_auth
    username: shipwise
    password: shipwise
  flyway:
    locations: classpath:db/migration

server:
  port: 8086

shipwise:
  jwt:
    secret: shipwise-jwt-secret-must-be-at-least-32-characters-long
    expiration: 86400000